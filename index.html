<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Jet Lag: Sydney Edition — Transit Game Companion</title>
  <meta name="description" content="Real-world Sydney transit map, challenge randomizer wheel, multi-mode Jet Lag game engine (Hide+Seek, Tag, Rail Rush, Capture the Flag, Race, Custom), and live multiplayer sync." />
  <meta name="theme-color" content="#080d1a" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet" />

  <!-- Leaflet 1.9.4 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <!-- PeerJS (Zero-Setup WebRTC Rooms) & QR Generator -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js" crossorigin=""></script>

  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <!-- SLIM TOP BAR -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">JL</div>
      <div class="brand-text">
        <div class="brand-title">Jet Lag: Sydney</div>
        <div class="brand-sub" id="network-meta-sub">394 Stops · 29 Lines</div>
      </div>
    </div>

    <div class="topbar-center">
      <button class="mode-chip" id="topbar-mode-btn" title="Game Mode & Controls">
        <span class="mode-dot" id="topbar-mode-dot"></span>
        <span id="topbar-mode-label">Hide + Seek</span>
      </button>
      <button class="clock-pill" id="topbar-clock-btn" title="Tap to Start / Pause Game Clock">
        <span id="topbar-clock-ico" class="ico-wrap"></span>
        <span id="topbar-clock-text">00:00</span>
      </button>
    </div>

    <div class="topbar-actions">
      <button class="room-status-btn" id="topbar-room-btn" title="Live Multiplayer & Sync">
        <span class="status-led"></span>
        <span id="topbar-room-label">Solo</span>
      </button>
      <button class="btn btn-ghost btn-xs icon-only" id="btn-theme-toggle" title="Toggle Outdoor Light / Dark Mode"></button>
    </div>
  </header>

  <!-- MAIN APP WORKSPACE -->
  <main class="app-shell">
    <!-- UNCLUTTERED FULL-BLEED SYDNEY MAP -->
    <section class="map-stage" aria-label="Interactive Sydney Transit Map">
      <div id="sydney-map"></div>

      <!-- Single Sleek Top Search Pill -->
      <div class="map-search-bar">
        <div class="search-input-wrap">
          <svg class="icon" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="station-search-input" placeholder="Search Sydney stations, wharves, lines..." autocomplete="off" />
          <button class="btn btn-ghost btn-xs" id="station-search-clear" style="display:none" aria-label="Clear search">Clear</button>
        </div>
        <div class="search-results" id="station-search-results"></div>
      </div>

      <!-- Minimal Right-Edge Floating Action Buttons (Tools, Layers, GPS) -->
      <div class="map-fab-stack">
        <button class="map-fab" id="fab-tools" title="Strategy Tools (Radar, Thermo, Ruler, Shade)">
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12l6.4-6.4"/></svg>
          <span>Tools</span>
        </button>
        <button class="map-fab" id="fab-layers" title="Map Layers, Lines & Base Map">
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
          <span>Layers</span>
        </button>
        <button class="map-fab" id="btn-locate-me" title="Center on My GPS">
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/></svg>
          <span>GPS</span>
        </button>
      </div>

      <!-- Collapsible Strategy Tools Popover -->
      <div class="map-popover" id="popover-tools" aria-label="Map Strategy Tools">
        <div class="popover-head">
          <strong>Map Strategy Tools</strong>
          <button class="btn btn-ghost btn-xs" data-close-popover>Done</button>
        </div>
        <div class="tool-grid">
          <button class="tool-btn active" data-map-tool="select">
            <svg class="icon" width="15" height="15" viewBox="0 0 24 24"><path d="M5 3l14 9-6 1.5L10 20 5 3z"/></svg>
            <span>Inspect</span>
          </button>
          <button class="tool-btn" data-map-tool="radar">
            <svg class="icon" width="15" height="15" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12l6.4-6.4"/></svg>
            <span>Radar</span>
          </button>
          <button class="tool-btn" data-map-tool="thermometer">
            <svg class="icon" width="15" height="15" viewBox="0 0 24 24"><path d="M14 14.76V5a2 2 0 0 0-4 0v9.76a4 4 0 1 0 4 0z"/></svg>
            <span>Thermo</span>
          </button>
          <button class="tool-btn" data-map-tool="ruler">
            <svg class="icon" width="15" height="15" viewBox="0 0 24 24"><path d="M21.3 8.7 15.3 2.7a1 1 0 0 0-1.4 0L2.7 13.9a1 1 0 0 0 0 1.4l6 6a1 1 0 0 0 1.4 0L21.3 10.1a1 1 0 0 0 0-1.4z"/></svg>
            <span>Ruler</span>
          </button>
          <button class="tool-btn" data-map-tool="polygon">
            <svg class="icon" width="15" height="15" viewBox="0 0 24 24"><polygon points="12 3 21 8.5 18 19.5 6 19.5 3 8.5 12 3"/></svg>
            <span>Shade</span>
          </button>
          <button class="tool-btn" data-map-tool="pin">
            <svg class="icon" width="15" height="15" viewBox="0 0 24 24"><path d="M12 21s-6-5.7-6-11a6 6 0 1 1 12 0c0 5.3-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg>
            <span>Pin</span>
          </button>
        </div>
        <div class="row" style="border-top:1px solid var(--border);padding-top:8px">
          <button class="btn btn-secondary btn-xs" id="btn-undo-ann" style="flex:1">Undo Last</button>
          <button class="btn btn-danger btn-xs" id="btn-clear-ann" style="flex:1">Clear Overlays</button>
        </div>
      </div>

      <!-- Collapsible Map Layers & Line Explorer Popover -->
      <div class="map-popover map-popover-wide" id="popover-layers" aria-label="Map Layers and Line Filters">
        <div class="popover-head">
          <strong>Map & Transit Layers</strong>
          <button class="btn btn-ghost btn-xs" data-close-popover>Done</button>
        </div>

        <div class="field">
          <label>Base Map Style</label>
          <select id="basemap-select" class="select">
            <option value="dark">Dark Street</option>
            <option value="minimal_dark">Minimal Dark</option>
            <option value="osm">Day Street (OSM)</option>
            <option value="light">Outdoor Light (Sun)</option>
            <option value="satellite">Satellite</option>
          </select>
        </div>

        <div class="row">
          <button class="btn btn-secondary btn-xs" id="btn-fit-sydney" style="flex:1">Greater Sydney</button>
          <button class="btn btn-secondary btn-xs" id="btn-fit-nsw" style="flex:1">Full NSW</button>
          <button class="btn btn-secondary btn-xs" id="btn-toggle-labels">Labels</button>
        </div>

        <div class="field">
          <label>Transit Modes</label>
          <div class="row" id="map-mode-filters" style="gap:5px">
            <button class="filter-chip on" data-transit-mode="train" style="--chip-col:#F99D1C"><span class="dot"></span>Trains</button>
            <button class="filter-chip on" data-transit-mode="metro" style="--chip-col:#168388"><span class="dot"></span>Metro</button>
            <button class="filter-chip on" data-transit-mode="light_rail" style="--chip-col:#BE1622"><span class="dot"></span>Light Rail</button>
            <button class="filter-chip on" data-transit-mode="ferry" style="--chip-col:#5AB031"><span class="dot"></span>Ferries</button>
            <button class="filter-chip on" data-transit-mode="intercity" style="--chip-col:#005AA3"><span class="dot"></span>Intercity</button>
          </div>
        </div>

        <div class="field" id="popover-line-explorer"></div>
      </div>

      <!-- Active Drawing Tool Banner (only shown while drawing!) -->
      <div class="tool-banner" id="map-tool-banner">
        <span id="map-tool-hint">Tap the map...</span>
        <div class="row" style="flex-shrink:0">
          <button class="btn btn-primary btn-xs" id="btn-tool-gps" style="display:none">At My GPS</button>
          <button class="btn btn-accent btn-xs" id="btn-tool-finish" style="display:none">Finish</button>
          <button class="btn btn-ghost btn-xs" id="btn-tool-cancel">Cancel</button>
        </div>
      </div>

      <!-- Active Line Isolation Pill (only shown when a single line is isolated) -->
      <div class="isolated-pill" id="isolated-line-pill" style="display:none">
        <span id="isolated-line-text">Showing M1</span>
        <button class="btn btn-ghost btn-xs" id="btn-clear-isolated">Show All</button>
      </div>
    </section>

    <!-- SIDE COMMAND DRAWER (Desktop Docked / Mobile Bottom Sheet) -->
    <aside class="side-panel" id="side-panel">
      <div class="mobile-drawer-handle" id="mobile-drawer-handle">
        <div class="sheet-pill"></div>
        <div class="row-between" style="width:100%">
          <strong id="mobile-drawer-title" style="font-family:var(--font-display);font-size:15px">Game Control</strong>
          <button class="btn btn-secondary btn-xs" id="btn-close-mobile-drawer">Back to Map</button>
        </div>
      </div>

      <nav class="panel-tabs" role="tablist">
        <button class="tab-btn active" data-tab="game">
          <svg class="icon" width="16" height="16" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="4"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><circle cx="15.5" cy="11" r="1" fill="currentColor"/><circle cx="18" cy="13" r="1" fill="currentColor"/></svg>
          <span>Game</span>
        </button>
        <button class="tab-btn" data-tab="wheel">
          <svg class="icon" width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M12 3v6.5M12 14.5V21M3 12h6.5M14.5 12H21"/></svg>
          <span>Wheel</span>
        </button>
        <button class="tab-btn" data-tab="feed">
          <svg class="icon" width="16" height="16" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>Feed</span>
        </button>
        <button class="tab-btn" data-tab="live">
          <svg class="icon" width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4M19.1 4.9a10 10 0 0 1 0 14.2M4.9 19.1a10 10 0 0 1 0-14.2"/></svg>
          <span>Live</span>
        </button>
      </nav>

      <div class="panel-body">
        <!-- TAB 1: GAME CONTROLS (Active Mode HQ First, Compact Collapsible Setup) -->
        <div class="tab-pane active" id="pane-game"></div>

        <!-- TAB 2: WHEEL, POWERUP SHOP & DECK BUILDER (Clean Segmented Views) -->
        <div class="tab-pane" id="pane-wheel">
          <div class="seg-bar" id="wheel-subtabs">
            <button class="seg-btn active" data-wsub="spin">Wheel</button>
            <button class="seg-btn" data-wsub="shop">Powerup Shop</button>
            <button class="seg-btn" data-wsub="deck">Deck Builder</button>
          </div>

          <div id="wsub-spin" class="sub-view active">
            <div class="card">
              <div class="card-header">
                <div class="card-title">Randomizer Wheel</div>
                <div class="row">
                  <button class="btn btn-xs btn-primary" id="wheel-type-challenges">Challenges</button>
                  <button class="btn btn-xs btn-ghost" id="wheel-type-curses">Curses</button>
                </div>
              </div>
              <div class="row" id="wheel-filter-row"></div>
              <div class="wheel-stage">
                <div class="wheel-wrap">
                  <canvas id="challenge-wheel-canvas" width="320" height="320"></canvas>
                </div>
                <div class="row" style="width:100%">
                  <button class="btn btn-primary" id="btn-spin-wheel" style="flex:1">Spin the Wheel</button>
                  <button class="btn btn-secondary" id="btn-shuffle-wheel" title="Load a fresh random sample onto the wheel">Shuffle</button>
                </div>
              </div>
            </div>
            <div id="wheel-landed-slot"></div>
            <div id="active-challenge-slot"></div>
            <div id="active-curses-slot"></div>
          </div>

          <div id="wsub-shop" class="sub-view"></div>
          <div id="wsub-deck" class="sub-view"></div>
        </div>

        <!-- TAB 3: LIVE ACTIVITY FEED, PHOTO PROOF & CHAT -->
        <div class="tab-pane" id="pane-feed"></div>

        <!-- TAB 4: MULTIPLAYER LIVE ROOMS, GPS & SETTINGS -->
        <div class="tab-pane" id="pane-live"></div>
      </div>
    </aside>
  </main>

  <!-- CLEAN 5-BUTTON MOBILE BOTTOM NAV -->
  <nav class="mobile-nav" aria-label="Mobile Navigation">
    <button class="active" data-mobile-tab="map">
      <svg class="icon" width="19" height="19" viewBox="0 0 24 24"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21 3 6"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>
      <span>Map</span>
    </button>
    <button data-mobile-tab="game">
      <svg class="icon" width="19" height="19" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="4"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/></svg>
      <span>Game</span>
    </button>
    <button data-mobile-tab="wheel">
      <svg class="icon" width="19" height="19" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg>
      <span>Wheel</span>
    </button>
    <button data-mobile-tab="feed">
      <svg class="icon" width="19" height="19" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>Feed</span>
    </button>
    <button data-mobile-tab="live">
      <svg class="icon" width="19" height="19" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4"/></svg>
      <span>Live</span>
    </button>
  </nav>

  <!-- REUSABLE MODAL DIALOG -->
  <div class="modal-backdrop" id="app-modal">
    <div class="modal-box" id="app-modal-box"></div>
  </div>

  <!-- TOAST NOTIFICATIONS -->
  <div class="toast-stack" id="toast-stack"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
