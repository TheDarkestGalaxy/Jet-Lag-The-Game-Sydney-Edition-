<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Jet Lag: Sydney Edition — Transit Game Companion</title>
  <meta name="description" content="Real-world Sydney transit map, challenge randomizer wheel, multi-mode Jet Lag game engine (Hide+Seek, Tag, Rail Rush, Capture the Flag, Race, Custom), and live multiplayer sync." />
  <meta name="theme-color" content="#080d1a" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet" />

  <!-- Leaflet 1.9.4 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <!-- PeerJS (Zero-Setup WebRTC Rooms) & QR Generator -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js" crossorigin=""></script>

  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <!-- TOP BROADCAST BAR -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">JL</div>
      <div>
        <div class="brand-title">Jet Lag: Sydney</div>
        <div class="brand-sub" id="network-meta-sub">394 Real Stops · 29 Lines</div>
      </div>
    </div>

    <div class="topbar-center">
      <button class="mode-chip" id="topbar-mode-btn" title="Switch Game Mode">
        <span class="mode-dot" id="topbar-mode-dot"></span>
        <span id="topbar-mode-label">Hide + Seek</span>
      </button>
      <button class="clock-pill" id="topbar-clock-btn" title="Click to Start / Pause Game Clock">
        <span id="topbar-clock-ico" class="ico-wrap"></span>
        <span id="topbar-clock-text">00:00</span>
      </button>
    </div>

    <div class="topbar-actions">
      <button class="room-status-btn" id="topbar-room-btn" title="Live Multiplayer & Sharing">
        <span class="status-led"></span>
        <span id="topbar-room-label">Solo</span>
      </button>
      <button class="btn btn-ghost btn-xs icon-only" id="btn-sound-toggle" title="Toggle Wheel Sound"></button>
      <button class="btn btn-ghost btn-xs icon-only" id="btn-theme-toggle" title="Toggle Outdoor Light / Dark Mode"></button>
    </div>
  </header>

  <!-- MAIN APP WORKSPACE -->
  <main class="app-shell">
    <!-- INTERACTIVE REAL-WORLD SYDNEY MAP STAGE -->
    <section class="map-stage" aria-label="Interactive Sydney Transit Map">
      <div id="sydney-map"></div>

      <!-- Floating Station Search -->
      <div class="map-search-bar">
        <div class="search-input-wrap">
          <svg class="icon" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="station-search-input" placeholder="Search 394 stations, wharves, lines..." autocomplete="off" />
          <button class="btn btn-ghost btn-xs" id="station-search-clear" style="display:none" aria-label="Clear search">Clear</button>
        </div>
        <div class="search-results" id="station-search-results"></div>
      </div>

      <!-- Floating Map Strategy Tools & Basemap Switcher -->
      <div class="map-tools-bar">
        <div class="tool-strip" role="toolbar" aria-label="Map Strategy Tools">
          <button class="tool-btn active" data-map-tool="select" title="Inspect stations & routes">
            <svg class="icon" width="14" height="14" viewBox="0 0 24 24"><path d="M5 3l14 9-6 1.5L10 20 5 3z"/></svg>
          </button>
          <button class="tool-btn" data-map-tool="radar" title="Draw Radar Hit/Miss Circle">
            <svg class="icon" width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12l6.4-6.4"/></svg>
            <span>Radar</span>
          </button>
          <button class="tool-btn" data-map-tool="thermometer" title="Draw Thermometer Perpendicular Bisector">
            <svg class="icon" width="14" height="14" viewBox="0 0 24 24"><path d="M14 14.76V5a2 2 0 0 0-4 0v9.76a4 4 0 1 0 4 0z"/></svg>
            <span>Thermo</span>
          </button>
          <button class="tool-btn" data-map-tool="ruler" title="Measure distance & ETA">
            <svg class="icon" width="14" height="14" viewBox="0 0 24 24"><path d="M21.3 8.7 15.3 2.7a1 1 0 0 0-1.4 0L2.7 13.9a1 1 0 0 0 0 1.4l6 6a1 1 0 0 0 1.4 0L21.3 10.1a1 1 0 0 0 0-1.4z"/></svg>
          </button>
          <button class="tool-btn" data-map-tool="polygon" title="Shade eliminated polygon zone">
            <svg class="icon" width="14" height="14" viewBox="0 0 24 24"><polygon points="12 3 21 8.5 18 19.5 6 19.5 3 8.5 12 3"/></svg>
          </button>
          <button class="tool-btn" data-map-tool="pin" title="Drop tactical pin">
            <svg class="icon" width="14" height="14" viewBox="0 0 24 24"><path d="M12 21s-6-5.7-6-11a6 6 0 1 1 12 0c0 5.3-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg>
          </button>
          <button class="tool-btn" id="btn-undo-ann" title="Undo last map overlay">
            <svg class="icon" width="14" height="14" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
          </button>
          <button class="tool-btn" id="btn-clear-ann" title="Clear all strategy overlays">
            <svg class="icon" width="14" height="14" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          </button>
        </div>

        <div class="tool-strip">
          <button class="tool-btn" id="btn-locate-me" title="Center on My GPS">
            <svg class="icon" width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/></svg>
            <span>GPS</span>
          </button>
          <button class="tool-btn" id="btn-fit-sydney" title="Fit Greater Sydney">SYD</button>
          <button class="tool-btn" id="btn-fit-nsw" title="Fit Full Intercity NSW Network">NSW</button>
          <button class="tool-btn" id="btn-toggle-labels" title="Toggle Permanent Station Labels">
            <svg class="icon" width="14" height="14" viewBox="0 0 24 24"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><circle cx="7" cy="7" r="1.5" fill="currentColor"/></svg>
          </button>
          <select id="basemap-select" class="select" style="width:auto;padding:4px 7px;font-size:11.5px;border:none;background:transparent" title="Change Base Map">
            <option value="dark">Dark Street</option>
            <option value="minimal_dark">Minimal Dark</option>
            <option value="osm">Day Street</option>
            <option value="light">Outdoor Light</option>
            <option value="satellite">Satellite</option>
          </select>
        </div>
      </div>

      <!-- Active Drawing Tool Banner -->
      <div class="tool-banner" id="map-tool-banner">
        <span id="map-tool-hint">Tap the map...</span>
        <button class="btn btn-primary btn-xs" id="btn-tool-gps" style="display:none">At My GPS</button>
        <button class="btn btn-accent btn-xs" id="btn-tool-finish" style="display:none">Finish</button>
        <button class="btn btn-ghost btn-xs" id="btn-tool-cancel">Cancel</button>
      </div>

      <!-- Floating Transit Mode Layer Chips -->
      <div class="map-filter-dock" id="map-mode-filters">
        <button class="filter-chip on" data-transit-mode="train" style="--chip-col:#F99D1C"><span class="dot"></span>Trains</button>
        <button class="filter-chip on" data-transit-mode="metro" style="--chip-col:#168388"><span class="dot"></span>Metro</button>
        <button class="filter-chip on" data-transit-mode="light_rail" style="--chip-col:#BE1622"><span class="dot"></span>Light Rail</button>
        <button class="filter-chip on" data-transit-mode="ferry" style="--chip-col:#5AB031"><span class="dot"></span>Ferries</button>
        <button class="filter-chip on" data-transit-mode="intercity" style="--chip-col:#005AA3"><span class="dot"></span>Intercity</button>
      </div>
    </section>

    <!-- SIDE COMMAND DRAWER (Desktop Docked / Mobile Bottom Sheet) -->
    <aside class="side-panel" id="side-panel">
      <div class="mobile-drawer-handle">
        <strong id="mobile-drawer-title" style="font-family:var(--font-display)">Game Control</strong>
        <button class="btn btn-ghost btn-xs" id="btn-close-mobile-drawer">Map</button>
      </div>

      <nav class="panel-tabs" role="tablist">
        <button class="tab-btn active" data-tab="game">
          <svg class="icon" width="16" height="16" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="4"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><circle cx="15.5" cy="11" r="1" fill="currentColor"/><circle cx="18" cy="13" r="1" fill="currentColor"/></svg>
          <span>Game</span>
        </button>
        <button class="tab-btn" data-tab="wheel">
          <svg class="icon" width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M12 3v6.5M12 14.5V21M3 12h6.5M14.5 12H21"/></svg>
          <span>Wheel</span>
        </button>
        <button class="tab-btn" data-tab="shop">
          <svg class="icon" width="16" height="16" viewBox="0 0 24 24"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/></svg>
          <span>Shop</span>
        </button>
        <button class="tab-btn" data-tab="feed">
          <svg class="icon" width="16" height="16" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>Feed</span>
        </button>
        <button class="tab-btn" data-tab="live">
          <svg class="icon" width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4M19.1 4.9a10 10 0 0 1 0 14.2M4.9 19.1a10 10 0 0 1 0-14.2"/></svg>
          <span>Live</span>
        </button>
      </nav>

      <div class="panel-body">
        <!-- TAB 1: GAME MODES, TEAMS & MODE COMMAND PANELS -->
        <div class="tab-pane active" id="pane-game"></div>

        <!-- TAB 2: CHALLENGE WHEEL, ACTIVE CARD, CURSES & DECK BUILDER -->
        <div class="tab-pane" id="pane-wheel">
          <div class="card">
            <div class="card-header">
              <div class="card-title">Randomizer Wheel</div>
              <div class="row">
                <button class="btn btn-xs btn-primary" id="wheel-type-challenges">Challenges</button>
                <button class="btn btn-xs btn-ghost" id="wheel-type-curses">Curses</button>
              </div>
            </div>
            <div class="row" id="wheel-filter-row"></div>
            <div class="wheel-stage">
              <div class="wheel-wrap">
                <canvas id="challenge-wheel-canvas" width="340" height="340"></canvas>
              </div>
              <div class="row" style="width:100%">
                <button class="btn btn-primary" id="btn-spin-wheel" style="flex:1">Spin the Wheel</button>
                <button class="btn btn-secondary" id="btn-shuffle-wheel" title="Load a fresh random sample of active cards onto the wheel">Shuffle</button>
              </div>
            </div>
          </div>

          <div id="wheel-landed-slot"></div>
          <div id="active-challenge-slot"></div>
          <div id="active-curses-slot"></div>
          <div id="deck-builder-slot"></div>
        </div>

        <!-- TAB 3: ECONOMY, POWERUPS & FULL SYDNEY LINE EXPLORER -->
        <div class="tab-pane" id="pane-shop"></div>

        <!-- TAB 4: LIVE ACTIVITY FEED, PHOTO PROOF & CHAT -->
        <div class="tab-pane" id="pane-feed"></div>

        <!-- TAB 5: MULTIPLAYER LIVE ROOMS, GPS & SYNC SETTINGS -->
        <div class="tab-pane" id="pane-live"></div>
      </div>
    </aside>
  </main>

  <!-- MOBILE BOTTOM NAVIGATION -->
  <nav class="mobile-nav" aria-label="Mobile Navigation">
    <button class="active" data-mobile-tab="map">
      <svg class="icon" width="17" height="17" viewBox="0 0 24 24"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21 3 6"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>
      <span>Map</span>
    </button>
    <button data-mobile-tab="game">
      <svg class="icon" width="17" height="17" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="4"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/></svg>
      <span>Game</span>
    </button>
    <button data-mobile-tab="wheel">
      <svg class="icon" width="17" height="17" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg>
      <span>Wheel</span>
    </button>
    <button data-mobile-tab="shop">
      <svg class="icon" width="17" height="17" viewBox="0 0 24 24"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/></svg>
      <span>Shop</span>
    </button>
    <button data-mobile-tab="feed">
      <svg class="icon" width="17" height="17" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>Feed</span>
    </button>
    <button data-mobile-tab="live">
      <svg class="icon" width="17" height="17" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4"/></svg>
      <span>Live</span>
    </button>
  </nav>

  <!-- REUSABLE MODAL DIALOG -->
  <div class="modal-backdrop" id="app-modal">
    <div class="modal-box" id="app-modal-box"></div>
  </div>

  <!-- TOAST NOTIFICATIONS -->
  <div class="toast-stack" id="toast-stack"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
